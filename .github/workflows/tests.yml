name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork PRs execute untrusted code. Never use pull_request_target here.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parser and receiver tests
        run: ./tests/run.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Configuration schema tests
        run: python tests/test_config.py

      - name: Validate ESP32-C6 configuration
        run: python -m esphome config tests/esp32-c6.yaml

      - name: Compile ESP32-C6 firmware
        run: python -m esphome compile tests/esp32-c6.yaml
