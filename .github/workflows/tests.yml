name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Parser and receiver
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parser and receiver tests
        run: ./tests/run.sh

  tests:
    name: ESPHome ${{ matrix.esphome }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        esphome: ["minimum", "latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/esphome-${{ matrix.esphome }}/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements/esphome-${{ matrix.esphome }}/requirements.txt

      - name: Configuration schema tests
        run: python tests/test_config.py

      - name: Validate ESP32-C6 configuration
        run: python -m esphome config tests/esp32-c6.yaml

      - name: Expose runner image for cache key
        run: echo "ImageOS=${ImageOS:?}" >> "$GITHUB_ENV"

      - name: Cache ESPHome ESP-IDF dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome/idf
          # The IDF cache includes a Python environment tied to this interpreter.
          key: >-
            esphome-idf-v1-${{ env.ImageOS }}-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.esphome }}-${{ hashFiles(format('requirements/esphome-{0}/requirements.txt', matrix.esphome), 'tests/esp32-c6.yaml') }}

      - name: Compile ESP32-C6 firmware
        run: python -m esphome compile tests/esp32-c6.yaml
