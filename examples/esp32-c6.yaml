esphome:
  name: heat-meter

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret heat_meter__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/hpuac/esphome-qalcosonic-e3.git
      # ref: refs/pull/1/head  # Replace 1 with the PR number to test.
    components: [qalcosonic_e3]
    # refresh: 1min  # Enable while testing remote changes.

uart:
  id: mbus_uart
  rx_pin: GPIO2
  tx_pin: GPIO3
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

qalcosonic_e3:
  uart_id: mbus_uart
  transport: optical # Use wired for an M-Bus master/transceiver.
  address: 0x01 # Your interface's primary address, or auto (one connected meter).
  update_interval: 2min # Optical: keep below the inactivity timeout; wired: e.g. 15min.
  unavailable_after_failures: 5
  energy:
    name: "Energy"
  flow:
    name: "Flow"
  flow_temperature:
    name: "Flow Temperature"
  power:
    name: "Power"
  return_temperature:
    name: "Return Temperature"
  temperature_difference:
    name: "Temperature Difference"
  volume:
    name: "Volume"
  battery_operating_duration:
    name: "Battery Operating Duration"
  error_code:
    name: "Error Code"
  error_start:
    name: "Error Start"
  manufacturer:
    name: "Manufacturer"
  meter_datetime:
    name: "Meter Date and Time"
  operating_time_without_error:
    name: "Operating Time Without Error"
  protocol_version:
    name: "Protocol Version"
  readout_failures:
    name: "Consecutive Readout Failures"
  readout_successful:
    name: "Readout Successful"
  serial_number:
    name: "Serial Number"
  automatic_readout:
    name: "Automatic Readout"
  discover_address:
    name: "Discover M-Bus Address"
  read_now:
    name: "Read Now"
