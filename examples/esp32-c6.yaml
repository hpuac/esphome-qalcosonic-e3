esphome:
  name: heat-meter

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret heat_meter__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/hpuac/esphome-qalcosonic-e3.git
      # ref: refs/pull/1/head  # Replace 1 with the PR number to test.
    components: [qalcosonic_e3]
    # refresh: 1min  # Enable while testing remote changes.

uart:
  id: mbus_uart
  rx_pin: GPIO2
  tx_pin: GPIO3
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

qalcosonic_e3:
  uart_id: mbus_uart
  update_interval: 2min
  energy:
    name: "Energy"
  volume:
    name: "Volume"
  power:
    name: "Power"
  flow:
    name: "Flow"
  flow_temperature:
    name: "Flow Temperature"
  return_temperature:
    name: "Return Temperature"
  temperature_difference:
    name: "Temperature Difference"
  error_code:
    name: "Error Code"
  battery_operating_duration:
    name: "Battery Operating Duration"
  operating_time_without_error:
    name: "Operating Time Without Error"
  protocol_version:
    name: "Protocol Version"
  readout_failures:
    name: "Readout Failures Since Reboot"
  meter_datetime:
    name: "Meter Date and Time"
  error_start:
    name: "Error Start"
  serial_number:
    name: "Serial Number"
  manufacturer:
    name: "Manufacturer"
  readout_successful:
    name: "Readout Successful"
  read_now:
    name: "Read Now"
